name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.gate.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: npm ci
      - run: npm run lint:js
      - run: npm test
      - name: Build and validate exact tagged source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash build.sh "$RELEASE_TAG"
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - id: version
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - id: gate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-gate.mjs "$RELEASE_TAG" "$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/
  deploy:
    concurrency:
      group: wordpress-org-formatting-extender
      cancel-in-progress: false
    needs: build
    if: github.event.release.prerelease == false && needs.build.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Verify and extract the released package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c "formatting-extender-${VERSION}.zip.sha256"
          unzip -q "formatting-extender-${VERSION}.zip" -d ../release-package
      - name: Deploy the verified file set to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: formatting-extender
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIR: release-package/formatting-extender
          ASSETS_DIR: .wordpress-org
