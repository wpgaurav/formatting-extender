<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Formatting Extender — directory banner</title>
<style>
@font-face{font-family:GTReallySans;src:url('fonts/ReallySansLarge-Black.otf');font-weight:800}
@font-face{font-family:Finlandica;src:url('fonts/FinlandicaTextVF-latin.otf');font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;background:#fffffc;font-family:Finlandica,sans-serif}main{width:772px;height:250px;position:relative;overflow:hidden;background:#fffffc;color:#22214a}
.identity{position:absolute;left:32px;top:25px;display:flex;align-items:center;gap:12px}.identity img{width:38px;height:38px;border-radius:6px}.identity span{font-size:12px;font-weight:600;color:#514f70}
h1{position:absolute;top:76px;left:31px;margin:0;font-family:GTReallySans,sans-serif;font-size:47px;font-weight:800;line-height:.98;letter-spacing:0}
.subtitle{position:absolute;left:33px;top:190px;margin:0;font-size:16px;line-height:1.2;color:#555370}
.examples{position:absolute;left:425px;top:29px;width:315px;height:191px;background:#3431a3;color:#fffffc;padding:23px 25px;border-radius:8px}
.row-one{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;white-space:nowrap}.badge{background:#ffcf45;color:#26236c;font-size:12px;font-weight:700;padding:5px 7px;border-radius:3px;line-height:1}
.line{margin-top:16px;font-size:22px;line-height:1.3}.line mark{background:#ffcf45;color:#26236c;padding:0 3px}
.rule{height:1px;background:#ffffff35;margin:19px 0 12px}.class{font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:11px}.braces{white-space:nowrap;flex-shrink:0;font-size:21px;color:#ffcf45;font-weight:600}.class span:last-child{color:#d3d2f0;font-size:13px;margin-left:auto}
</style></head><body><main aria-label="Formatting Extender. Badges, highlights, and your CSS classes."><div class="identity"><img src="icon.png" alt="Formatting Extender icon"><span>WORDPRESS BLOCK EDITOR</span></div><h1>Formatting<br>Extender</h1><p class="subtitle">Badges. Highlights. Your CSS classes.</p><section class="examples" aria-label="Formatting examples"><div class="row-one"><span class="badge">NEW</span><span>Make it clear.</span></div><div class="line">Highlight <mark>what matters.</mark></div><div class="rule"></div><div class="class"><span class="braces">{ }</span><span>.your-style</span><span>CSS classes</span></div></section></main></body></html>
